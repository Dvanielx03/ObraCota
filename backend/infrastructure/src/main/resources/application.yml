spring:
  profiles:
    default: prod
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints.web.exposure.include: health
  endpoint.health.show-details: never
security:
  jwt-secret: ${JWT_SECRET}
  secure-cookie: ${COOKIE_SECURE:true}
  access-ttl: PT10M
  refresh-ttl: P7D
