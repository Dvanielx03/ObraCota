spring:
  profiles:
    default: prod
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/{vendor}
ai:
  budget:
    # One monthly cap for every paid AI call (visual options and document assistant).
    monthly-limit-cents: ${AI_MONTHLY_LIMIT_CENTS:800}
management:
  endpoints.web.exposure.include: health
  endpoint.health.show-details: never
security:
  jwt-secret: ${JWT_SECRET}
  secure-cookie: ${COOKIE_SECURE:true}
  access-ttl: PT10M
  refresh-ttl: P7D
