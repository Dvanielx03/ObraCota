# ObraCota en Docker, desde la raíz del repositorio.
#
#   docker compose up -d --build                    landing en http://localhost:3200
#   docker compose ps                              comprueba los cuatro servicios
#   docker compose down                             detiene todo (los datos se conservan)
#
# Aplicación con visor local en el puerto 3201.
#
# Aislamiento (R3): el motor IFC solo está en la red interna «motores», sin puertos publicados ni salida a
# internet, y atiende únicamente peticiones con el token compartido ENGINE_TOKEN (el backend lo envía como
# «Authorization: Bearer»). Cada servicio tiene límites de memoria y CPU: ReStage supera 4,5 GiB en la
# primera pasada de IfcDiff, por eso el motor tiene 6 GiB.
#
# Variables obligatorias en .env: POSTGRES_PASSWORD, JWT_SECRET y ENGINE_TOKEN (cada una un secreto
# aleatorio distinto, por ejemplo `openssl rand -base64 32`).

name: obracota

services:
  app:
    environment:
      API_INTERNAL_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    build:
      context: ./app
      args:
        API_INTERNAL_URL: http://backend:8080
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:${LANDING_PORT:-3200}}
    image: obracota-app:local
    ports:
      - "${APP_PORT:-3201}:3000"
    mem_limit: 1g
    cpus: 1
    restart: unless-stopped

  landing:
    build:
      context: ./landing
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:${LANDING_PORT:-3200}}
        NEXT_PUBLIC_PANEL_URL: ${PANEL_URL:-http://localhost:${APP_PORT:-3201}}
    image: obracota-landing:local
    ports:
      - "${LANDING_PORT:-3200}:3000"
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: runtime
    volumes:
      - modelos-originales:/srv/originals
    image: obracota-backend:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Images for Renderizar and Editar: "gemini" (paid per image) or "cloudflare" (Workers AI free daily quota).
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-gemini}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      # RVT to IFC with Autodesk Platform Services Model Derivative; empty id or secret turns the conversion off.
      # APS_BUCKET is optional (default: "obracota-" + a hash of the client id).
      APS_CLIENT_ID: ${APS_CLIENT_ID:-}
      APS_CLIENT_SECRET: ${APS_CLIENT_SECRET:-}
      APS_BUCKET: ${APS_BUCKET:-}
      IFC_ENGINE_URL: http://ifc-engine:8000
      ENGINE_TOKEN: ${ENGINE_TOKEN:?Configura ENGINE_TOKEN en .env}
      # The heap follows mem_limit instead of the 25 % default of the JVM.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
      AI_MONTHLY_LIMIT_CENTS: ${AI_MONTHLY_LIMIT_CENTS:-800}
      # Design agent (H4): "fake" runs a scripted agent without AI; "gemini" calls Gemini (needs GEMINI_API_KEY).
      AGENT_PROVIDER: ${AGENT_PROVIDER:-fake}
      AGENT_MODEL: ${AGENT_MODEL:-}
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-obracota}
      POSTGRES_USER: ${POSTGRES_USER:-obracota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET en .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # «Continuar con Google» (Google Identity Services, sin costo): el client id OAuth de tipo «Aplicación web».
      # Vacío lo apaga: el botón no aparece. La app lo lee de GET /api/auth/google/config, sin reconstruir.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    networks:
      - default
      - motores
    mem_limit: 1536m
    cpus: 2
    restart: unless-stopped

  ifc-engine:
    build:
      context: ./ifc-engine
      target: runtime
    restart: unless-stopped
    environment:
      ENGINE_TOKEN: ${ENGINE_TOKEN:?Configura ENGINE_TOKEN en .env}
    volumes:
      - modelos-originales:/srv/originals:ro
    # Only the internal network: no published port and no route to the internet.
    networks:
      - motores
    mem_limit: 6g
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-obracota}
      POSTGRES_USER: ${POSTGRES_USER:-obracota}
      # La contraseña se configura en el archivo local .env; sin ella Compose no arranca.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: 1
    restart: unless-stopped

networks:
  # Backend <-> engines only. internal: no outbound traffic and no published ports for its members.
  motores:
    internal: true

volumes:
  modelos-originales:
  datos-postgres:
